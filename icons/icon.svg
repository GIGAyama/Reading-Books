<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="どくしょ ちょきんばこ">
  <!--
    GIGA山 学習アプリ群の共通デザインに合わせたアイコン。
      ・ぬりは6トークンのみ（--bg / --panel / --text / --primary / --secondary / --accent）
      ・輪郭は太く（12〜14px）、色は --text
      ・グラデーション・ぼかし影は使わず、影は「段差」で表す
  -->
  <g id="tokens">
    <!-- bg #FFF8F0 / panel #FFFFFF / text #3D2B1F / primary #E8603C
         secondary #4ECDC4 / accent #FFE66D -->
  </g>

  <!-- 背景 -->
  <rect width="512" height="512" fill="#FFF8F0"/>

  <!-- コイン（本にためていく「ちょきん」） -->
  <g transform="translate(256 128)">
    <circle cx="0" cy="8" r="66" fill="#3D2B1F"/>
    <circle cx="0" cy="0" r="66" fill="#FFE66D" stroke="#3D2B1F" stroke-width="13"/>
    <g fill="none" stroke="#3D2B1F" stroke-width="12" stroke-linecap="round">
      <path d="M-23 -27 L0 -3 L23 -27"/>
      <path d="M0 -3 L0 29"/>
      <path d="M-21 5 L21 5"/>
      <path d="M-21 19 L21 19"/>
    </g>
  </g>

  <!-- 本（ちょきんばこ） -->
  <g transform="translate(256 326)">
    <!-- 段差の影 -->
    <rect x="-186" y="-58" width="372" height="184" rx="30" fill="#3D2B1F"/>

    <!-- 表紙 -->
    <rect x="-192" y="-68" width="372" height="184" rx="30" fill="#E8603C" stroke="#3D2B1F" stroke-width="13"/>

    <!-- 左右のページ -->
    <rect x="-166" y="-42" width="152" height="132" rx="14" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="10"/>
    <rect x="14"   y="-42" width="152" height="132" rx="14" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="10"/>

    <!-- 文字（行） -->
    <g stroke="#4ECDC4" stroke-width="13" stroke-linecap="round">
      <path d="M-142 -6 h104"/>
      <path d="M-142 24 h104"/>
      <path d="M-142 54 h68"/>
      <path d="M38 -6 h104"/>
      <path d="M38 24 h104"/>
      <path d="M38 54 h68"/>
    </g>

    <!-- コイン投入口 -->
    <rect x="-66" y="-92" width="132" height="34" rx="17" fill="#3D2B1F"/>
  </g>
</svg>
